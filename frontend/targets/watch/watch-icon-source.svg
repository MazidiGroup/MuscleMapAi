<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Watch-only icon. watchOS masks icons circular; App Review rejects a
       black background because the mask edge disappears (guideline 4).
       Same chevron mark as the phone icon, inverted onto the brand blue. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="125%">
      <stop offset="0" stop-color="#5aa7ff"></stop>
      <stop offset=".6" stop-color="#2f8dff"></stop>
      <stop offset="1" stop-color="#1d6ae0"></stop>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"></rect>
  <g transform="translate(50 50) scale(.82) translate(-50 -50)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 45 L50 33 L60 45" stroke-width="4.5" opacity=".5"></path>
    <path d="M31 59 L50 41 L69 59" stroke-width="6" opacity=".72"></path>
    <path d="M22 73 L50 49 L78 73" stroke-width="7.5" opacity=".9"></path>
    <path d="M13 87 L50 57 L87 87" stroke-width="9"></path>
  </g>
</svg>
